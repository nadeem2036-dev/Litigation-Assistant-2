<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="45%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0b172a" />
    </linearGradient>

    <!-- Rich Gold Gradient for Scales & Typography -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="55%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Arc Gold Gradient for Highlight -->
    <linearGradient id="arcTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <linearGradient id="chainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#022c22" flood-opacity="0.9" />
    </filter>

    <!-- Visible Arc Path for LITIGATION ASSISTANT arched text -->
    <path id="archTextPath" d="M 52,126 A 218,218 0 0,1 460,126" fill="none" />
  </defs>

  <!-- Base Icon Background with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Double Gold Border for Official Emblem Feel -->
  <rect x="20" y="20" width="472" height="472" rx="94" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-opacity="0.65" />
  <rect x="28" y="28" width="456" height="456" rx="86" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Arched Banner Guide / Ribbon Backing -->
  <path d="M 44,136 A 232,232 0 0,1 468,136" fill="none" stroke="url(#goldGrad)" stroke-width="32" stroke-linecap="round" opacity="0.18" />
  <path d="M 44,136 A 232,232 0 0,1 468,136" fill="none" stroke="#022c22" stroke-width="26" stroke-linecap="round" opacity="0.65" />

  <!-- Arched Text: LITIGATION ASSISTANT (Prominent, High Contrast, Centered Arc) -->
  <text filter="url(#textGlow)" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif, system-ui" font-weight="900" font-size="27" letter-spacing="4" fill="url(#arcTextGrad)">
    <textPath href="#archTextPath" startOffset="50%" text-anchor="middle">
      LITIGATION ASSISTANT
    </textPath>
  </text>

  <!-- Golden Stars on sides of arc -->
  <polygon points="56,128 59,122 66,122 60,118 62,112 56,115 50,112 52,118 46,122 53,122" fill="#fef08a" />
  <polygon points="456,128 459,122 466,122 460,118 462,112 456,115 450,112 452,118 446,122 453,122" fill="#fef08a" />

  <!-- Subtle Radial Glow Behind Balance -->
  <circle cx="256" cy="275" r="160" fill="#f59e0b" opacity="0.08" />

  <!-- Scales of Justice (Properly Scaled Under Arc) -->
  <g filter="url(#dropShadow)">
    <!-- Top Finial / Spearhead Tip of Balance -->
    <path d="M256,138 L265,158 L256,168 L247,158 Z" fill="url(#goldGrad)" />
    <circle cx="256" cy="174" r="9" fill="url(#goldGrad)" />

    <!-- Central Fulcrum / Pivot Ring -->
    <circle cx="256" cy="198" r="16" fill="url(#goldGrad)" />
    <circle cx="256" cy="198" r="7" fill="#064e3b" />
    <circle cx="256" cy="198" r="3.5" fill="url(#goldGrad)" />

    <!-- Main Horizontal Beam (Tapered) -->
    <path d="M120,198 Q256,190 392,198 Q256,206 120,198 Z" fill="url(#goldGrad)" />
    <!-- Beam End Pivot Rings -->
    <circle cx="120" cy="198" r="8.5" fill="url(#goldGrad)" />
    <circle cx="120" cy="198" r="3.5" fill="#064e3b" />
    <circle cx="392" cy="198" r="8.5" fill="url(#goldGrad)" />
    <circle cx="392" cy="198" r="3.5" fill="#064e3b" />

    <!-- Central Vertical Pillar -->
    <rect x="251" y="208" width="10" height="180" rx="4" fill="url(#goldGrad)" />
    <line x1="254" y1="214" x2="254" y2="384" stroke="#fef08a" stroke-width="2" stroke-linecap="round" opacity="0.75" />

    <!-- LEFT SCALE SUSPENSION CHAINS -->
    <line x1="120" y1="206" x2="92" y2="288" stroke="url(#chainGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="120" y1="206" x2="120" y2="288" stroke="url(#chainGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="120" y1="206" x2="148" y2="288" stroke="url(#chainGrad)" stroke-width="2.5" stroke-linecap="round" />

    <!-- LEFT BALANCE PAN (DISH) -->
    <path d="M84,288 C84,316 156,316 156,288 Z" fill="url(#plateGrad)" />
    <ellipse cx="120" cy="288" rx="36" ry="9" fill="url(#goldGrad)" />
    <ellipse cx="120" cy="288" rx="30" ry="6" fill="#b45309" opacity="0.5" />

    <!-- RIGHT SCALE SUSPENSION CHAINS -->
    <line x1="392" y1="206" x2="364" y2="288" stroke="url(#chainGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="392" y1="206" x2="392" y2="288" stroke="url(#chainGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="392" y1="206" x2="420" y2="288" stroke="url(#chainGrad)" stroke-width="2.5" stroke-linecap="round" />

    <!-- RIGHT BALANCE PAN (DISH) -->
    <path d="M356,288 C356,316 428,316 428,288 Z" fill="url(#plateGrad)" />
    <ellipse cx="392" cy="288" rx="36" ry="9" fill="url(#goldGrad)" />
    <ellipse cx="392" cy="288" rx="30" ry="6" fill="#b45309" opacity="0.5" />

    <!-- BASE PEDESTAL -->
    <rect x="238" y="386" width="36" height="12" rx="3" fill="url(#goldGrad)" />
    <path d="M242,396 L216,428 L296,428 L270,396 Z" fill="url(#plateGrad)" />
    <rect x="194" y="428" width="124" height="14" rx="4" fill="url(#goldGrad)" />
    <rect x="174" y="440" width="164" height="18" rx="5" fill="url(#goldGrad)" />
    <rect x="180" y="454" width="152" height="4" rx="2" fill="#78350f" opacity="0.8" />
  </g>

  <!-- Laurel Wreath Embellishment at Base -->
  <g fill="url(#goldGrad)" opacity="0.8">
    <path d="M156,432 C146,416 146,396 154,384 C156,394 160,408 166,418 Z" />
    <path d="M140,402 C132,388 134,370 142,360 C144,370 148,382 152,392 Z" />
    <path d="M356,432 C366,416 366,396 358,384 C356,394 352,408 346,418 Z" />
    <path d="M372,402 C380,388 378,370 370,360 C368,370 364,382 360,392 Z" />
  </g>

  <!-- Subtitle Ribbon at Bottom: KPST & PHC -->
  <rect x="160" y="470" width="192" height="22" rx="11" fill="#022c22" stroke="url(#goldGrad)" stroke-width="1.5" />
  <text x="256" y="485" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" letter-spacing="2" fill="#fef08a">KPST &amp; HIGH COURT</text>
</svg>
